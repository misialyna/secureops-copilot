[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[project]
name = "secureops-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "qdrant-client",
    "sentence-transformers",
    "pymupdf",
    "langchain-text-splitters",
    "langchain-core",
    "langchain-groq",
    "groq",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
    "scapy",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "strict"
markers = [
    "slow: integration tests that hit the network and/or a real Qdrant index (excluded from CI by default)",
]
