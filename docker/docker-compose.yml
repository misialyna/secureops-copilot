services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: secureops
      POSTGRES_PASSWORD: secureops
      POSTGRES_DB: secureops
    ports:
      - "5432:5432"
    volumes:
      - secureops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureops -d secureops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  secureops-postgres-data:
